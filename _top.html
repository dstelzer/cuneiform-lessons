<div id="settings">
	Options:
	<select id="modesel" onload="dropdown_load('modesel');" onchange="dropdown_change('modesel');">
		<option value="hidebound" selected>Signs</option>
		<option value="showbound">Bound transcription</option>
	</select>
	<select id="fontsel" onload="dropdown_load('fontsel');" onchange="dropdown_change('fontsel');">
		<option value="font-ink" selected>Ink</option>
		<option value="font-publish">Published</option>
		<option value="font-write">Handwritten</option>
		<option value="font-linear">Linear</option>
	</select>
</div>
